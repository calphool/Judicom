# Installed by install_services.sh as /etc/systemd/journald.conf.d/90-judicom.conf.
# Keeps the system log on the card (Raspberry Pi OS keeps it in memory only: 40-rpi-volatile-storage.conf), so that after a
# restart it can be seen what happened before it, but only for about a day:
#   a new log file every hour, files older than a day are removed, and never more than 50 MB (always 1 GB of the card left free).
# (About 2000 log lines an hour: a day is a few MB.)   See it:  journalctl -b -1  (the boot before this one)
[Journal]
Storage=persistent
MaxFileSec=1h
MaxRetentionSec=1day
SystemMaxUse=50M
SystemKeepFree=1G
