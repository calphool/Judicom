# This Judicom's own facts.  Copy to /home/joe/judicom-site.conf on the Judicom (NOT into git: the repository is public),
# fill in, then:  sudo systemctl restart judicom-phone
# Every line may be left out: without [weather] there is simply no weather screen.

[judi]
# The names Judi goes by in photo captions (shown as "You"), separated by commas.
names = Judi

[weather]
# Shown at the top of the weather screen.
place = Springfield
# Where to get the weather for (decimal degrees; north and east are positive).  Any spot in town will do.
latitude = 39.80
longitude = -89.65
# The time zone the forecast's days follow, such as America/Chicago (auto: the place's own).
timezone = auto
