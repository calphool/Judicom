; Judicom: calls to Judi's number from VoIP.ms (added 2026-11-04).
; Callers on the allowed list (judicom-allowed.conf) ring the Judicom for up to 40 s (VoIP.ms gives up on unanswered calls at about 60 s); everyone else, and hidden numbers,
; hear the protected-number message.  No answer / busy: the caller hears "Judi can't come to the phone right now".
[judicom-inbound]
exten => s,1,NoOp(Call for Judi from ${CALLERID(num)})
 same => n,Set(CID=${FILTER(0-9,${CALLERID(num)})})
 same => n,ExecIf($[${LEN(${CID})} = 11 & ${CID:0:1} = 1]?Set(CID=${CID:1}))
 same => n,GotoIf(${DIALPLAN_EXISTS(judicom-allowed,${CID},1)}?allowed)
 same => n,NoOp(Not on Judi's list: ${CID})
 same => n,Answer()
 same => n,Wait(1)
 same => n,Playback(custom/judicom-protected)
 same => n,Hangup()
 same => n(allowed),NoOp(On Judi's list: ${CID})
 same => n,Dial(PJSIP/judicom,40)
 same => n,GotoIf($["${DIALSTATUS}" = "ANSWER"]?done)
 same => n,Answer()
 same => n,Wait(1)
 same => n,Playback(custom/judicom-unavailable)
 same => n(done),Hangup()
