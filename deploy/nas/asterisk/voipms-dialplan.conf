[voipms-audio-test]
exten => s,1,NoOp(VoIP.ms CGNAT audio test)
 same => n,PlayTones(330/300,294/300,262/300,294/300,330/300,330/300,330/600,0/200,294/300,294/300,294/600,0/200,330/300,392/300,392/600)
 same => n,Wait(10)
 same => n,StopPlayTones()
 same => n,Hangup()
[from-voipms]
; Calls to Judi's number go to the Judicom screening (judicom-inbound.conf).  Was a 1000 Hz test tone until 2026-11-04.
exten => s,1,Goto(judicom-inbound,s,1)
exten => _X.,1,Goto(judicom-inbound,s,1)
[voipms-record-test]
exten => s,1,Answer()
 same => n,NoOp(Testing silent RTP initialization)
 same => n,Playback(/tmp/asterisk-silence)
 same => n,Record(/tmp/linphone-test.wav,3,15,q)
 same => n,Hangup()
[from-judicom]
exten => 100,1,Answer()
 same => n,NoOp(Judicom melody test)
 same => n,Playback(custom/ode-to-joy)
 same => n,Hangup()
exten => 101,1,Answer()
 same => n,NoOp(Judicom microphone loopback test)
 same => n,Playback(custom/beep)
 same => n,Record(/tmp/judicom-test.wav,0,5)
 same => n,Playback(/tmp/judicom-test)
 same => n,Hangup()
; Judicom: calls to real numbers go out through VoIP.ms.  North American 10-digit numbers only (added 2026-11-04).
exten => _NXXNXXXXXX,1,NoOp(Judicom calling ${EXTEN})
 same => n,Dial(PJSIP/1${EXTEN}@voipms,45)
 same => n,Hangup()
exten => _1NXXNXXXXXX,1,Goto(${EXTEN:1},1)
